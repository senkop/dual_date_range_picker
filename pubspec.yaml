name: dual_date_range_picker
description: A date range picker with Gregorian and Hijri (Umm al-Qura) calendars, quick presets, start/end time fields and English/Arabic labels.
version: 0.1.0
homepage: https://github.com/senkop/dual_date_range_picker
repository: https://github.com/senkop/dual_date_range_picker
issue_tracker: https://github.com/senkop/dual_date_range_picker/issues
topics:
  - date-picker
  - hijri
  - calendar
  - arabic
  - widget

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  hijri: ^3.0.1

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
